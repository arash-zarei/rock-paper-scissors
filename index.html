<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Rock Paper Scissors</title>
  </head>
  <body>
    <h1 class="title">Rock Paper Scissors</h1>
    <p class="description">First to 3 Points Wins</p>
    <button class="restart-button">Reset</button>
    <div class="player-layout">
      <div class="player-box">
        <p class="player-title" id="player">PLAYER</p>
        <p class="score" id="player-score">0</p>
        <img class="player-image" id="player-selected" src="./img/rock.png" />
      </div>
      <div class="player-box">
        <p class="player-title" id="computer">COMPUTER</p>
        <p class="score" id="computer-score">0</p>
        <img
          class="player-image"
          id="computer-selected"
          src="./img/paper.png"
        />
      </div>
    </div>
    <div class="select-layout">
      <img data-status="rock" class="buttons" src="./img/rock.png" />
      <img data-status="paper" class="buttons" src="./img/paper.png" />
      <img data-status="scissors" class="buttons" src="./img/scissors.png" />
    </div>

    <script src="./app.js"></script>
  </body>
</html>
